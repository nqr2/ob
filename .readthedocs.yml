# Configuration for Read the Docs.

version: 2

submodules:
  include: all

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"

  jobs:
    pre_build:
      - "mkdir -p .build"
      - "doxygen doc/.Doxyfile.rtd"
    build:
      html:
        - "mkdir -p $READTHEDOCS_OUTPUT"
        - "cp -r .build/docs/html $READTHEDOCS_OUTPUT/html"
